apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-api-gateway
          image: github.com/trunglq04/goride/api-gateway
          ports:
            - containerPort: 8081
              name: http
            - containerPort: 9091
              name: metrics
          resources:
            requests:
              memory: "128Mi"
              cpu: "125m"
            limits:
              memory: "128Mi"
              cpu: "125m"
          env:
            - name: HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  key: GATEWAY_HTTP_ADDR
                  name: app-config
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  key: ENVIRONMENT
                  name: app-config
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  key: JAEGER_ENDPOINT
                  name: app-config
            - name: RABBITMQ_URI
              valueFrom:
                secretKeyRef:
                  key: RABBITMQ_URI
                  name: app-secrets
            - name: STRIPE_WEBHOOK_KEY
              valueFrom:
                secretKeyRef:
                  key: STRIPE_WEBHOOK_KEY
                  name: app-secrets
            - name: TRIP_SERVICE_URL
              value: "trip-service:9093"
            - name: DRIVER_SERVICE_URL
              value: "driver-service:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer
  ports:
    - port: 8081
      name: http
      targetPort: 8081
    - port: 9091
      name: metrics
      targetPort: 9091
  selector:
    app: api-gateway
