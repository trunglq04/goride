apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: github.com/trunglq04/goride/auth-service
          ports:
            - containerPort: 9094
            - containerPort: 9091
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: app-config
          env:
            - name: JWT_PRIVATE_KEY_PATH
              value: "/etc/secrets/jwt_private.pem"
            - name: JWT_PUBLIC_KEY_PATH
              value: "/etc/secrets/jwt_public.pem"
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/secrets
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - name: grpc
      port: 9094
      targetPort: 9094
    - name: metrics
      port: 9091
      targetPort: 9091
