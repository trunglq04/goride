syntax = "proto3";

package auth;

option go_package = "shared/proto/auth;auth";

service AuthService {
  rpc Register(RegisterRequest)           returns (RegisterResponse);
  rpc VerifyOTP(VerifyOTPRequest)         returns (VerifyOTPResponse);
  rpc ResendOTP(ResendOTPRequest)         returns (ResendOTPResponse);
  rpc Login(LoginRequest)                 returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest)   returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest)               returns (LogoutResponse);
  rpc GetMe(GetMeRequest)                 returns (GetMeResponse); 
}

message RegisterRequest {
  string full_name = 1;
  string email     = 2;
  string phone     = 3;
  string password  = 4;
  string role      = 5; // "rider" or "driver"
}

message RegisterResponse {
  string user_id = 1;
  string message = 2;
}

message VerifyOTPRequest {
  string user_id = 1;
  string code    = 2;
}

message VerifyOTPResponse {
  string access_token  = 1;
  string refresh_token = 2;
  User   user          = 3;
}

message ResendOTPRequest {
  string user_id = 1;
}

message ResendOTPResponse {
  string message = 1;
}

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message LoginResponse {
  string access_token  = 1;
  string refresh_token = 2;
  User   user          = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token  = 1;
  string refresh_token = 2;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  string message = 1;
}

message GetMeRequest {
  // user_id is extracted from gRPC metadata (set by API gateway)
}

message GetMeResponse {
  User user = 1;
}

message User {
  string id              = 1;
  string full_name       = 2;
  string email           = 3;
  string phone           = 4;
  string role            = 5;
  bool   email_confirmed = 6;
  string created_at      = 7;
}
